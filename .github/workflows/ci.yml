name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` (type-check + lint) runs at install; the explicit steps below report each check.
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Served version matches the release notes
        if: ${{ !cancelled() }}
        run: node scripts/check-version.mjs
        env:
          REQUIRE_RELEASED: ${{ github.event_name == 'push' && '1' || '0' }}
