name: Claude

# Claude works on a story (a GitHub issue):
# - launched by La Fabrique (workflow_dispatch with the issue number, or the `ready-for-claude` label);
# - or by a person mentioning @claude in an issue or a pull request.
# It always works on a branch `claude/<issue>-<subject>` from `master` and opens a pull request
# to `master`. It never pushes onto `master`.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue (story) number"
        required: true
        type: number
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-for-claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # FABRIQUE_TOKEN rather than GITHUB_TOKEN, so that Claude's pushes and pull requests run CI.
          token: ${{ secrets.FABRIQUE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.FABRIQUE_TOKEN }}
          # La Fabrique's GitHub App launches runs: set the repository variable FABRIQUE_BOTS
          # to its bot login (e.g. `my-app[bot]`).
          allowed_bots: ${{ vars.FABRIQUE_BOTS }}
          label_trigger: ready-for-claude
          branch_prefix: claude/
          base_branch: master
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && format('Work on story (issue) #{0} of {1}. Read the issue and its acceptance criteria, and CLAUDE.md. Create a branch claude/{0}-<short-subject> from master, implement the story, add its entry on top of docs/release-notes.json, version \"next\", no heure (stories includes {0}; see CLAUDE.md), run npm run type-check, npm run lint, npm test and npm run build, push the branch and open a pull request to master that closes #{0}. Never push onto master.', inputs.issue, github.repository) || '' }}
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(node scripts/*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout -b:*),Bash(git switch -c:*),Bash(git push -u origin claude/*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*)"
