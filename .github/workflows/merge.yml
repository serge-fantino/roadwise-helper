# Merges a pull request into master, which is RoadWise's production (Netlify builds master): started by La Fabrique
# ("Merge" on a pull request of the sprint: a go, Product Engineer and super admin), or by hand (Actions > Merge > Run
# workflow). This is La Fabrique's own merge workflow (la-fabrique: .github/workflows/merge.yml, served at
# /guide/exemples/merge.yml), with RoadWise's checks. master is merged into the pull request's branch,
# docs/release-notes.json is rebuilt from master's with the pull request's own entries on top, kept "next"
# (scripts/fabrique/release-notes.js merge --mode next: La Fabrique's release-notes tool, copied as it is, declared in
# .fabrique.json > version.outil); the release at the close of the sprint numbers them (release.yml). Never a conflict on
# that file; any other conflict stops the merge: bring the pull request up to date first ("Update with Claude"). The
# checks run again, the branch is pushed, then the pull request is squash-merged.
# Repository secret: FABRIQUE_TOKEN (fine-grained, this repository: Contents, Pull requests and Issues, read and write):
# the merge it makes on master starts the deployment, which the GITHUB_TOKEN would not.
name: Merge
run-name: "Merge #${{ inputs.pr }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
      par:
        description: "Who merges (GitHub login, set by La Fabrique)"
        required: false

concurrency:
  group: merge-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTES: docs/release-notes.json
      # Why the merge was refused, in a sentence: an annotation of the run (La Fabrique reads it) and a comment on the
      # pull request.
      REASON_FILE: /tmp/merge-reason
    steps:
      - name: Inputs
        env:
          FABRIQUE_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          [ -n "$FABRIQUE_TOKEN" ] || { echo "::error::Secret FABRIQUE_TOKEN missing (see this workflow's header)."; exit 1; }
          case "$PR" in ''|*[!0-9]*) echo "::error::Not a pull request number: $PR"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.FABRIQUE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Commit identity
        run: |
          git config user.name "La Fabrique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Master merged into the pull request, release notes numbered
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          refuse() { echo "::error title=Merge refused::$1"; echo "$1" > "$REASON_FILE"; exit 1; }
          info=$(gh pr view "$PR" --json headRefName,baseRefName,state,isDraft,title)
          [ "$(jq -r .state <<<"$info")" = "OPEN" ] || refuse "Pull request #$PR is not open."
          [ "$(jq -r .baseRefName <<<"$info")" = "master" ] || refuse "Pull request #$PR does not target master."
          [ "$(jq -r .isDraft <<<"$info")" = "false" ] || refuse "Pull request #$PR is a draft."
          branch=$(jq -r .headRefName <<<"$info")
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "TITLE=$(jq -r .title <<<"$info")" >> "$GITHUB_ENV"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          tmp=$(mktemp -d)
          # The tool as master has it: the pull request's branch may predate it.
          tool=$(git show origin/master:.fabrique.json | jq -r '.version.outil // empty')
          [ -n "$tool" ] || refuse "master's .fabrique.json does not declare version.outil (La Fabrique's release-notes tool)."
          git show "origin/master:$tool" > "$tmp/release-notes.js"
          TOOL="$tmp/release-notes.js"
          git show "$(git merge-base HEAD origin/master):$NOTES" > "$tmp/base.json"
          cp "$NOTES" "$tmp/branch.json"
          git show "origin/master:$NOTES" > "$tmp/master.json"
          git merge --no-commit --no-ff origin/master >/dev/null 2>&1 || true
          versions=$(node "$TOOL" merge "$tmp/base.json" "$tmp/branch.json" "$tmp/master.json" "$NOTES" --mode next)
          git add "$NOTES"
          left=$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ $//')
          [ -z "$left" ] || refuse "Conflicts with master in: $left. Bring the pull request up to date first (Update with Claude), then merge again."
          echo "VERSIONS=$versions" >> "$GITHUB_ENV"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -q -m "Merge master${versions:+; release $versions at merge}"
          elif ! git diff --cached --quiet; then
            git commit -q -m "Release $versions at merge"
          fi

      - name: Dependencies
        run: npm ci

      - name: Checks
        run: |
          refuse() { echo "$1" > "$REASON_FILE"; echo "::error title=Merge refused::$1"; exit 1; }
          npm run type-check || refuse "The type check fails once master is merged into the pull request: see the run."
          npm run lint || refuse "Lint fails once master is merged into the pull request: see the run."
          npm test || refuse "Tests fail once master is merged into the pull request: see the run."
          npm run build || refuse "The build fails once master is merged into the pull request: see the run."
          node scripts/check-version.mjs || refuse "dist/version.json does not match the release notes: see the run."

      - name: Push, then squash-merge
        env:
          GH_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          PR: ${{ inputs.pr }}
          PAR: ${{ inputs.par }}
        run: |
          head=$(git rev-parse HEAD)
          git push origin "HEAD:$BRANCH"
          # Right after a push, GitHub is still working out whether the pull request can be merged, and refuses
          # ("Base branch was modified"): wait until it has seen the new head and says MERGEABLE, then merge,
          # trying again a few times.
          for attempt in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR" --json headRefOid,mergeable --jq '.headRefOid + " " + .mergeable')
            if [ "$state" = "$head MERGEABLE" ] && gh pr merge "$PR" --squash --match-head-commit "$head" --subject "$TITLE (#$PR)"; then
              merged=yes
              break
            fi
            [ "$state" = "$head CONFLICTING" ] && { echo "Pull request #$PR conflicts with master again (master moved meanwhile): run Merge once more." > "$REASON_FILE"; echo "::error title=Merge refused::Pull request #$PR conflicts with master again (master moved meanwhile): run Merge once more."; exit 1; }
            echo "GitHub is not ready to merge #$PR yet ($state): trying again in 10 seconds."
            sleep 10
          done
          [ "${merged:-}" = yes ] || { echo "GitHub did not merge #$PR in time; the branch is pushed, numbered and checked: run Merge again." > "$REASON_FILE"; echo "::error title=Merge refused::GitHub did not merge #$PR in time; the branch is pushed, numbered and checked: run Merge again."; exit 1; }
          gh pr comment "$PR" --body "Merged into master${VERSIONS:+ as release $VERSIONS}${PAR:+, at the request of @$PAR}, from La Fabrique."
